[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-to-painting-dataset"
version = "0.1.0"
description = "Turning 15,000 cat photos into a stroke-by-stroke painting dataset: cleaning, alignment, quality filters, painting and before/after edit pairs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "brush-gpt",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.0",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "torch>=2.2",
]

[tool.setuptools.packages.find]
include = ["photo2painting*"]

[tool.uv.sources]
# The painter, the prepared cat and the attribute readers, pinned to a commit of their repo.
brush-gpt = { git = "https://github.com/alina0607/brush-gpt", rev = "f01671c" }
# On Linux (including CI) install the CPU build of torch: the default Linux wheel
# pulls several gigabytes of CUDA libraries that a machine without a GPU never uses.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "PT"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Test functions take pytest fixtures and return nothing; annotating every
# one adds noise without catching bugs.
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# Libraries without type information.
module = ["brushgpt.*", "skimage.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true
